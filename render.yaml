services:
  - type: web
    name: resume-builder-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:5180"
      - key: PLAN_MODE
        value: manual
      - key: ENABLE_ENTITLEMENTS
        value: "true"
      - key: FREE_DAILY_LLM
        value: "25"
      - key: SUBSCRIPTION_MONTHS
        value: "12"
      - key: UPI_ID
        value: "harshitrocky9-1@okaxis"
      - key: UPI_PAYEE_NAME
        value: BuilderPayee
      - key: UPI_PAYMENT_AMOUNT
        value: "499"
      - key: UPI_CURRENCY
        value: "INR"